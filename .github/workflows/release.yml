name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache gcc musl-dev linux-headers &&
            gcc -O2 -Wall -Wextra -Werror -static -s -o beszel-hid-ups beszel-hid-ups.c
          '
      - name: Checksums
        run: sha256sum beszel-hid-ups beszel-hid-ups.initd beszel-hid-ups.service > SHA256SUMS
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" beszel-hid-ups beszel-hid-ups.initd beszel-hid-ups.service SHA256SUMS --clobber
